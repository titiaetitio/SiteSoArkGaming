<!DOCTYPE html>
<html lang="pt">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogos de Nintendo - ARK GAMING</title>
  <!-- Folhas de estilo externas (CSS global e CSS de detalhes de jogos) -->
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="jogos.css">
  <!-- Importação dos ícones do Bootstrap (para o perfil de login e carrinho) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

  <!-- ========================================= -->
  <!-- CABEÇALHO / NAVBAR                        -->
  <!-- ========================================= -->
  <header class="navbar">
    <div class="nav-left">
      <a href="index.html">
        <img src="Imagens/logo.jpg" alt="ARK GAMING">
      </a>
    </div>
    <ul class="nav-center">
      <li class="hover-pill"><a href="pc.html">PC</a></li>
      <li class="hover-pill"><a href="ps.html">PlayStation</a></li>
      <li class="hover-pill"><a href="X.html">Xbox</a></li>
      <!-- Link ativo da categoria atual (Nintendo) destacado a vermelho -->
      <li class="hover-pill"><a href="ntd.html" style="color: #ff4655; font-weight: bold;">Nintendo</a></li>
    </ul>
    <div class="nav-right">
      <!-- Ligação direta para a página de login / formulário -->
      <a href="login.html" class="icon-btn hover-pill"><i class="bi bi-person"></i></a>
      <a href="#" class="icon-btn hover-pill"><i class="bi bi-cart-dash"></i></a>
    </div>
  </header>

  <!-- ========================================= -->
  <!-- CONTEÚDO DA CATEGORIA NINTENDO            -->
  <!-- ========================================= -->
  <main style="padding: 40px 5%; max-width: 1200px; margin: 0 auto;">
    <h1 style="color: #fff; margin-bottom: 20px; font-size: 28px;">🔴 Jogos para Nintendo (Switch)</h1>
    <p style="color: #aaa; margin-bottom: 40px;">Códigos digitais para a Nintendo eShop com os melhores clássicos e novidades.</p>

    <!-- Grelha de Jogos (Estruturada com CSS Grid) -->
    <div class="games-grid" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;">
      
      <!-- Card do Jogo: Zelda -->
      <div class="game-card" style="background: #222; border-radius: 8px; overflow: hidden; border: 1px solid #333;">
        <a href="zelda.html"><img src="Imagens/Legend of zelda.png" alt="The Legend of Zelda" style="width: 100%; height: 250px; object-fit: cover;"></a>
        <div style="padding: 15px;">
          <h3 style="color: #fff; font-size: 16px; margin-bottom: 10px;">The Legend of Zelda: Ocarina of Time</h3>
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <span style="color: #ff4655; font-weight: bold; font-size: 18px;">49.99 €</span>
            <a href="zelda.html" style="background: #ff4655; color: #fff; padding: 8px 12px; border-radius: 4px; text-decoration: none; font-size: 13px;">Ver jogo</a>
          </div>
        </div>
      </div>

    </div>
  </main>

</body>
</html>
