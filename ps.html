<!DOCTYPE html>
<html lang="pt">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogos de PlayStation - ARK GAMING</title>
  <!-- Folhas de estilo externas (CSS global e CSS de detalhes de jogos) -->
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="jogos.css">
  <!-- Importação dos ícones do Bootstrap (para o perfil de login e carrinho) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

  <!-- ========================================= -->
  <!-- CABEÇALHO / NAVBAR                        -->
  <!-- ========================================= -->
  <header class="navbar">
    <div class="nav-left">
      <a href="index.html">
        <img src="Imagens/logo.jpg" alt="ARK GAMING">
      </a>
    </div>
    <ul class="nav-center">
      <li class="hover-pill"><a href="pc.html">PC</a></li>
      <!-- Link ativo da categoria atual (PlayStation) destacado a vermelho -->
      <li class="hover-pill"><a href="ps.html" style="color: #ff4655; font-weight: bold;">PlayStation</a></li>
      <li class="hover-pill"><a href="X.html">Xbox</a></li>
      <li class="hover-pill"><a href="ntd.html">Nintendo</a></li>
    </ul>
    <div class="nav-right">
      <!-- Ligação direta para a página de login / formulário -->
      <a href="login.html" class="icon-btn hover-pill"><i class="bi bi-person"></i></a>
      <a href="#" class="icon-btn hover-pill"><i class="bi bi-cart-dash"></i></a>
    </div>
  </header>

  <!-- ========================================= -->
  <!-- CONTEÚDO DA CATEGORIA PLAYSTATION         -->
  <!-- ========================================= -->
  <main style="padding: 40px 5%; max-width: 1200px; margin: 0 auto;">
    <h1 style="color: #fff; margin-bottom: 20px; font-size: 28px;">🎮 Jogos para PlayStation (PS4 / PS5)</h1>
    <p style="color: #aaa; margin-bottom: 40px;">Chaves digitais e cartões PSN para a tua consola PlayStation com entrega instantânea.</p>

    <!-- Grelha de Jogos (Estruturada com CSS Grid) -->
    <div class="games-grid" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;">
      
      <!-- Card do Jogo 1: EA Sports FC 27 -->
      <div class="game-card" style="background: #222; border-radius: 8px; overflow: hidden; border: 1px solid #333;">
        <a href="fc27.html"><img src="Imagens/FC27.jpg" alt="EA Sports FC 27" style="width: 100%; height: 250px; object-fit: cover;"></a>
        <div style="padding: 15px;">
          <h3 style="color: #fff; font-size: 16px; margin-bottom: 10px;">EA Sports FC 27</h3>
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <span style="color: #ff4655; font-weight: bold; font-size: 18px;">49.99 €</span>
            <a href="fc27.html" style="background: #ff4655; color: #fff; padding: 8px 12px; border-radius: 4px; text-decoration: none; font-size: 13px;">Ver jogo</a>
          </div>
        </div>
      </div>

      <!-- Card do Jogo 2: Phantom Blade Zero -->
      <div class="game-card" style="background: #222; border-radius: 8px; overflow: hidden; border: 1px solid #333;">
        <a href="Blade-Zero.html"><img src="Imagens/Phantom-blade.jpg" alt="Phantom Blade Zero" style="width: 100%; height: 250px; object-fit: cover;"></a>
        <div style="padding: 15px;">
          <h3 style="color: #fff; font-size: 16px; margin-bottom: 10px;">Phantom Blade Zero</h3>
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <span style="color: #ff4655; font-weight: bold; font-size: 18px;">45.49 €</span>
            <a href="Blade-Zero.html" style="background: #ff4655; color: #fff; padding: 8px 12px; border-radius: 4px; text-decoration: none; font-size: 13px;">Ver jogo</a>
          </div>
        </div>
      </div>

      <!-- Card do Jogo 3: Cyberpunk 2077 -->
      <div class="game-card" style="background: #222; border-radius: 8px; overflow: hidden; border: 1px solid #333;">
        <a href="cyberpunk.html"><img src="Imagens/Cyberpunk.jpg" alt="Cyberpunk 2077" style="width: 100%; height: 250px; object-fit: cover;"></a>
        <div style="padding: 15px;">
          <h3 style="color: #fff; font-size: 16px; margin-bottom: 10px;">Cyberpunk 2077</h3>
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <span style="color: #ff4655; font-weight: bold; font-size: 18px;">19.99 €</span>
            <a href="cyberpunk.html" style="background: #ff4655; color: #fff; padding: 8px 12px; border-radius: 4px; text-decoration: none; font-size: 13px;">Ver jogo</a>
          </div>
        </div>
      </div>

    </div>
  </main>

</html>
